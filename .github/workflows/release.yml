name: Release APK

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: GitHub release tag to publish
        required: true
        default: v1.0.0
        type: string
  repository_dispatch:
    types: [publish-ayda-release]

permissions:
  contents: write

jobs:
  release:
    name: Build and publish installable APK
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platforms;android-35 build-tools;35.0.0
          accept-android-sdk-licenses: true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run unit tests and assemble debug APK
        run: ./gradlew --no-daemon testDebugUnitTest assembleDebug --stacktrace --console=plain

      - name: Publish GitHub release and direct APK download
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ inputs.tag_name || github.event.client_payload.tag_name }}
          TARGET_SHA: ${{ github.event.client_payload.target_sha || github.sha }}
        run: |
          set -euo pipefail
          if [[ ! "$TAG_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Tag must use semantic version form, for example v1.0.0." >&2
            exit 1
          fi

          apk="app/build/outputs/apk/debug/app-debug.apk"
          asset="AydaNailroom-${TAG_NAME}.apk"
          if gh release view "$TAG_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG_NAME" "${apk}#${asset}" --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG_NAME" "${apk}#${asset}" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$TARGET_SHA" \
              --title "Ayda Nailroom ${TAG_NAME}" \
              --notes "Installable debug APK for Ayda Nailroom. Built and unit-tested from commit ${TARGET_SHA}."
          fi

          download_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/download/${TAG_NAME}/${asset}"
          echo "Direct APK download: ${download_url}" | tee -a "$GITHUB_STEP_SUMMARY"
