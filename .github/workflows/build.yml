name: Android APK

on:
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and test Android app
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platforms;android-35 build-tools;35.0.0
          accept-android-sdk-licenses: true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run unit tests and assemble debug APK
        id: gradle-build
        run: |
          set +e
          ./gradlew --no-daemon testDebugUnitTest assembleDebug --stacktrace --console=plain > gradle-build.log 2>&1
          result=$?
          if [ "$result" -ne 0 ]; then
            printf '\n### Gradle failure details\n\n```text\n' >> "$GITHUB_STEP_SUMMARY"
            tail -n 100 gradle-build.log >> "$GITHUB_STEP_SUMMARY"
            printf '\n```\n' >> "$GITHUB_STEP_SUMMARY"
            python3 - <<'PY'
          from pathlib import Path
          log = Path("gradle-build.log").read_text(errors="replace").splitlines()
          useful = [line for line in log if line.startswith(("e: ", "w: ")) or "FAILURE:" in line or "What went wrong:" in line or "Execution failed for task" in line]
          for line in (useful[-60:] or log[-30:]):
              escaped = line.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
              print(f"::error::{escaped}")
          PY
          fi
          exit "$result"

      - name: Upload Gradle failure log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: AydaNailroom-build-log
          path: gradle-build.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload installable debug APK
        uses: actions/upload-artifact@v4
        with:
          name: AydaNailroom-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload Room schema
        uses: actions/upload-artifact@v4
        with:
          name: AydaNailroom-room-schema
          path: app/schemas/**/*.json
          if-no-files-found: warn
          retention-days: 30
